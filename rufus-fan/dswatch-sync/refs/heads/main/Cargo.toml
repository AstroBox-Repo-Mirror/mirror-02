[package]
name = "dswatch-sync"
version = "0.1.0"
edition = "2024"
description = "采集 DeepSeek 余额与用量，推送到 DS Watch 手环快应用"

[lib]
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.2"
waki = "0.5.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
